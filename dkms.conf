# dkms.conf — LotSpeed CC 模块 + NeoQ qdisc 模块的 DKMS 打包描述
#
# 为什么必须有这个文件:
#   install.sh 当前的持久化手段是 /etc/modules-load.d/{lotspeed,sch_neoq}.conf,
#   那只表达"开机 modprobe 这两个名字"。内核一升级 (无人值守安全更新就会做),
#   新内核的 /lib/modules/<新版本>/ 下根本没有这两个 .ko —— modprobe 静默失败,
#   CC 回落到默认 (bbr/cubic), qdisc 回落到 fq_codel。用户看到的现象是"加速某天
#   突然就没了", 而线索只有 journal 里一行 modprobe 找不到模块。
#   对一键安装的产品来说这是不可接受的失效方式: 它无声、延迟发生、且和"用户做过
#   的任何事"都不相关。DKMS 把"每装一个新内核就重编一次"挂到内核包的 postinst 上,
#   让加速跟着内核走, 所以它是必选项而不是优化项。
#
# 版本号约定 (PACKAGE_VERSION):
#   取**整套件**版本, 与 install.sh 顶部的 VERSION= 逐字一致, 而不是单个模块的
#   版本 —— lotspeed.c 的 LS_VERSION_STR="2.2.0" 与 qdisc_newneo.c 的
#   NEOQ_VERSION="3.1" 是两条独立的模块版本线。一个 DKMS 包只能有一个版本号,
#   取套件版本是唯一不产生歧义的口径。
#   它同时决定源码目录名 /usr/src/lotspeed-<PACKAGE_VERSION>, 所以升版本时三处
#   必须同步: install.sh 的 VERSION / 本文件 / dkms add 用的路径。
PACKAGE_NAME="lotspeed"
PACKAGE_VERSION="2.2"

# 新内核装上就自动重编重装。这是本文件存在的全部理由, 不要关。
AUTOINSTALL="yes"

# 刻意不设 REMAKE_INITRD: DKMS 3.x 已弃用该键, 留着会让每一条 dkms 命令都多打一行
# "Deprecated feature" 警告。它的语义 (不重建 initramfs) 本来就是默认行为 —— 这两个
# 模块都在网络栈起来之后才需要, 不参与早期启动。
# ---------------- 构建 ----------------
# 直接调 kbuild, 刻意**不**走仓库 Makefile 的 all: / clean: 目标, 两个原因:
#
#  1. clean: 依赖 clean-dkms.conf, 而后者就是 `$(RM) dkms.conf`。DKMS 会在构建
#     目录里执行 CLEAN —— 那等于让 CLEAN 把本文件自己删掉。
#  2. Makefile 的 KERNEL_DIR 默认值是 $(shell uname -r) 推出来的, 也就是**当前
#     运行**的内核。DKMS 编的是**刚装上、还没启动**的那个内核 (${kernelver}),
#     直接 `make` 会针对错误的内核树编译, 而且往往还能编过 —— 是最坏的一类 bug。
#
# 用 M= 形式一样能吃到仓库 Makefile 里的 obj-m / sch_neoq-objs / ccflags-y
# (kbuild 只取那几个变量赋值), 但绕开了上面两颗雷。
#
# ${kernel_source_dir} / ${kernelver} / ${dkms_tree} 都由 dkms 在 source 本文件
# **之前**设好, 可以直接用。刻意不用 $(pwd): dkms.conf 是被 `.` 进去的, $() 会在
# source 的那一刻展开, 那时 cwd 并不是构建目录。
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# ---------------- 产物 ----------------
# [0] CC 模块: 源文件名与产物名相同, 无陷阱。
BUILT_MODULE_NAME[0]="lotspeed"
DEST_MODULE_LOCATION[0]="/kernel/net/ipv4"

# [1] qdisc 模块: **源文件是 qdisc_newneo.c, 产物是 sch_neoq.ko**。
#     改名发生在 Makefile 的 `sch_neoq-objs := qdisc_newneo.o` 这一行。
#     BUILT_MODULE_NAME 必须写**产物名** sch_neoq —— 写成 qdisc_newneo 的话编译会
#     成功, 失败发生在之后的 "Module qdisc_newneo.ko not found" 上, 报错点离原因
#     很远, 是这个包最容易踩且最难查的一处。
BUILT_MODULE_NAME[1]="sch_neoq"
DEST_MODULE_LOCATION[1]="/kernel/net/sched"

# ---------------- 刻意不做的事 ----------------
# 不设 BUILD_EXCLUSIVE_KERNEL。
#   本模块确实有 6.6 硬门 (register_net_sysctl_sz、四参数 cong_control), 而且还要
#   BBRv3 补丁 (TCP_CONG_WANTS_CE_EVENTS / .skb_marked_lost 不在主线)。但用正则去
#   卡内核版本, 失效方向是反的: 正则写宽了挡不住人, 写窄了会让一个**本来编得过**的
#   新内核被静默跳过 —— 那恰好退化成本文件要消灭的"加速悄悄没了"。
#   让它去编: 编不过会在 journal 和 /var/lib/dkms/lotspeed/2.2/build/make.log 里
#   留下一条响亮的编译错误, 远好过静默跳过。
